name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job is allowed to write, and it asks below.
permissions:
  contents: read

jobs:
  # Both helper jobs go through scripts/build-helper.sh, which comes back through
  # scripts/build.mjs. The compilers, targets and libraries live there and nowhere else: a second
  # copy of them here is how the helper CI ships ends up linked differently from the one a
  # developer builds — an arm64-only macOS binary, or a Windows one missing GDI+.
  helper-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile the macOS hotkey helper
        run: bash scripts/build-helper.sh
      - uses: actions/upload-artifact@v4
        with:
          name: helper-mac
          path: dist/helper/mac/fxp-hotkey

  helper-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile the Windows hotkey helper
        shell: bash
        run: bash scripts/build-helper.sh
      - uses: actions/upload-artifact@v4
        with:
          name: helper-win
          path: dist/helper/win/fxp-hotkey.exe

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  package-mac:
    needs: [helper-mac, helper-win, checks]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: helper-win
          path: prebuilt/win
      - name: Build extension bundle
        run: |
          npm run build
          chmod 755 dist/helper/mac/fxp-hotkey
      - name: Sign ZXP
        run: bash scripts/sign.sh
      - name: Build macOS installer
        run: bash scripts/make-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FX-Premiere-macos
          path: |
            release/*.zxp
            release/*.pkg

  package-win:
    needs: [helper-mac, helper-win, checks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: helper-mac
          path: prebuilt/mac
      - name: Build extension bundle
        run: npm run build
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          iscc /DAppVersion=$version scripts\installer-win.iss
      - uses: actions/upload-artifact@v4
        with:
          name: FX-Premiere-windows
          path: release/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-mac, package-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the installers belong on the release; the helper artifacts are build inputs.
      - uses: actions/download-artifact@v4
        with:
          pattern: FX-Premiere-*
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
